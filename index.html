<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>網頁版紅白機模擬器</title>
  <style>
    body {
      background-color: #222;
      color: #fff;
      font-family: sans-serif;
      text-align: center;
      margin: 0;
      padding: 10px;
      touch-action: manipulation;
    }
    #game-container {
      margin: 0 auto;
      max-width: 512px;
    }
    canvas {
      width: 100%;
      height: auto;
      background: #000;
      border: 2px solid #555;
    }
    .controls {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
      margin-top: 20px;
    }
    .dpad, .buttons {
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .btn {
      background: #444;
      color: white;
      border: 1px solid #666;
      border-radius: 8px;
      padding: 15px;
      font-size: 18px;
      user-select: none;
      width: 60px;
      height: 60px;
      margin: 5px;
    }
    .btn:active { background: #888; }
    .action-btn { background: #c00; border-radius: 50%; }
    #rom-input { margin: 15px 0; }
  </style>
  <script src="https://unpkg.com/jsnes/dist/jsnes.min.js"></script>
</head>
<body>

  <h2>網頁版紅白機模擬器</h2>
  <input type="file" id="rom-input" accept=".nes">

  <div id="game-container">
    <canvas id="nes-canvas" width="256" height="240"></canvas>
  </div>

  <div class="controls">
    <div class="dpad">
      <button class="btn" id="btn-up">▲</button>
      <div>
        <button class="btn" id="btn-left">◄</button>
        <button class="btn" id="btn-right">►</button>
      </div>
      <button class="btn" id="btn-down">▼</button>
    </div>
    <div class="buttons">
      <div>
        <button class="btn action-btn" id="btn-a">A</button>
        <button class="btn action-btn" id="btn-b">B</button>
      </div>
      <div>
        <button class="btn" id="btn-select" style="width: auto; height: auto;">Select</button>
        <button class="btn" id="btn-start" style="width: auto; height: auto;">Start</button>
      </div>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('nes-canvas');
    const ctx = canvas.getContext('2d');
    const imageData = ctx.createImageData(256, 240);
    const buf = new ArrayBuffer(imageData.data.length);
    const buf8 = new Uint8ClampedArray(buf);
    const data = new Uint32Array(buf);

    // 初始化 JSNES
    const nes = new jsnes.NES({
      onFrame: function(frameBuffer) {
        for (let i = 0; i < frameBuffer.length; i++) {
          data[i] = 0xFF000000 | frameBuffer[i];
        }
        imageData.data.set(buf8);
        ctx.putImageData(imageData, 0, 0);
      }
    });

    // 載入本地 NES 檔案
    document.getElementById('rom-input').addEventListener('change', function(e) {
      const file = e.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(e) {
        const romData = e.target.result;
        nes.loadROM(romData);
        
        // 開始繪製遊戲畫面迴圈
        function step() {
          nes.frame();
          requestAnimationFrame(step);
        }
        requestAnimationFrame(step);
      };
      reader.readAsBinaryString(file);
    });

    // 綁定觸控按鈕事件對應控制（按鍵對應表）
    const keyMap = {
      'btn-up': jsnes.Controller.BUTTON_UP,
      'btn-down': jsnes.Controller.BUTTON_DOWN,
      'btn-left': jsnes.Controller.BUTTON_LEFT,
      'btn-right': jsnes.Controller.BUTTON_RIGHT,
      'btn-a': jsnes.Controller.BUTTON_A,
      'btn-b': jsnes.Controller.BUTTON_B,
      'btn-start': jsnes.Controller.BUTTON_START,
      'btn-select': jsnes.Controller.BUTTON_SELECT,
    };

    Object.keys(keyMap).forEach(id => {
      const btn = document.getElementById(id);
      const buttonCode = keyMap[id];

      btn.addEventListener('touchstart', (e) => {
        e.preventDefault();
        nes.buttonDown(1, buttonCode);
      });
      btn.addEventListener('touchend', (e) => {
        e.preventDefault();
        nes.buttonUp(1, buttonCode);
      });
    });
  </script>
</body>
</html>
